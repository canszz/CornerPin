[package]
name = "cornerpin"
version = "1.2.0"
edition = "2021"
description = "Pencere köşe sabitleyici tepsi uygulaması"

[dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "shellapi",
    "winreg",
    "synchapi",
    "errhandlingapi",
    "handleapi",
    "libloaderapi",
    "winerror",
    "winnt",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
